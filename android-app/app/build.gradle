plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.mooncare.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.mooncare.app"
        minSdk 24
        targetSdk 35
        versionCode 9
        versionName "1.3.2"

        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.14"
        buildPython("C:/Users/shy/AppData/Local/Programs/Python/Python314/python.exe")
        pip {
            options("--retries", "10")
            options("--timeout", "300")
            install("fastapi==0.99.1")
            install("pydantic==1.10.27")
            install("starlette==0.27.0")
            install("uvicorn==0.30.6")
            install("httpx==0.27.2")
            install("python-multipart==0.0.9")
            install("python-dotenv==1.0.1")
            install("requests==2.32.3")
        }
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
}
